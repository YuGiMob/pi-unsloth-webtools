name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.19.0, 24, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Package check
        run: npm run check:package

      - name: Publish check
        run: npm run check:publint

      - name: Run unit tests
        run: npm run test:unit

  lightpanda:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Lightpanda
        run: |
          echo "PI_LIGHTPANDA_E2E=1" >> "$GITHUB_ENV"
          echo "PI_LIGHTPANDA_E2E_BIN=$(bash scripts/install-lightpanda.sh --print-path)" >> "$GITHUB_ENV"

      - name: Render pages with the local renderer
        run: npm run test:lightpanda
